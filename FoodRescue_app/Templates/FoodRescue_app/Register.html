<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Rescue Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ================= GENERAL ================= */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #031a14,
                #064e3b,
                #031a14
            );
            color: #e4fff7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        /* ================= REGISTER CARD ================= */

        .register-card {
            width: 100%;
            max-width: 450px;
            background: #082f25;
            padding: 30px;
            border: 1px solid #16483b;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
        }

        .register-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(
                90deg,
                #00e5bd,
                #008f72
            );
        }

        /* ================= HEADING ================= */

        .register-card h2 {
            background: linear-gradient(
                135deg,
                #00e5bd,
                #008f72
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            font-size: 28px;
            margin-bottom: 22px;
        }

        /* ================= LABELS ================= */

        .form-label,
        .register-card label {
            color: #e4fff7;
            font-weight: 600;
            margin-bottom: 5px;
        }

        /* ================= INPUT FIELDS ================= */

        .form-control,
        .form-select {
            background-color: #031a14;
            color: #ffffff;
            border: 1px solid #286052;
            border-radius: 8px;
            padding: 10px 12px;
            min-height: 42px;
        }

        .form-control::placeholder {
            color: #86a99e;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #031a14;
            color: #ffffff;
            border-color: #00e5bd;
            box-shadow: 0 0 0 3px rgba(0, 229, 189, 0.12);
        }

        .form-select option {
            background: #082f25;
            color: #ffffff;
        }

        /* ================= REGISTER BUTTON ================= */

        .register-card .btn {
            background: linear-gradient(
                135deg,
                #00e5bd,
                #008f72
            );
            color: #031a14 !important;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 12px;
            transition: 0.3s ease;
        }

        .register-card .btn:hover {
            background: linear-gradient(
                135deg,
                #00c9a7,
                #007a61
            );
            color: #ffffff !important;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 229, 189, 0.18);
        }

        /* ================= LOGIN LINK ================= */

        .register-card .text-center {
            color: #a7c9bf;
        }

        .register-card a {
            color: #00e5bd;
            font-weight: 600;
            text-decoration: none;
        }

        .register-card a:hover {
            color: #8fffe5;
            text-decoration: underline;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 576px) {
            body {
                padding: 20px 12px;
            }

            .register-card {
                padding: 26px 22px;
            }

            .register-card h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="register-card shadow-lg">

    <h2>
        Food Rescue Registration
    </h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-2">
            <label>Full Name</label>
            <input type="text" name="name" class="form-control">
        </div>

        <div class="mb-1">
            <label>Email</label>
            <input type="email" name="email" class="form-control">
        </div>

        <div class="mb-1">
            <label>Phone Number</label>
            <input type="tel"
                   name="phone"
                   class="form-control"
                   pattern="[6-9][0-9]{9}"
                   maxlength="10"
                   minlength="10"
                   required>
        </div>

        <div class="mb-1">
            <label>Username</label>
            <input type="text" name="username" class="form-control">
        </div>

        <div class="mb-1">
            <label>Password</label>
            <input type="password" name="password" class="form-control">
        </div>

        <div class="mb-1">
            <label>Confirm Password</label>
            <input type="password" name="cpassword" class="form-control">
        </div>

        <div class="mb-1">
            <label class="form-label">Register As</label>

            <select name="role" class="form-select" required>
                <option value="">Select Role</option>
                <option value="hotel">Hotel / Restaurant</option>
                <option value="customer">Customer</option>
                <option value="delivery">Delivery Partner</option>
            </select>
        </div>

        <button type="submit" class="btn w-100">
            Register
        </button>

    </form>

    <div class="text-center mt-3">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </div>

</div>

</body>
</html>
