<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Rescue Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

<style>
    /* ================= GENERAL ================= */

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #031a14;
        color: #e4fff7;
        min-height: 100vh;
    }

    /* ================= NAVBAR ================= */

    .navbar {
        background: #05251d !important;
        padding: 15px 0;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
    }

    .navbar-brand {
        font-size: 22px;
        letter-spacing: 0.3px;
        color: #ffffff !important;
    }

    .navbar .nav-link {
        color: rgba(255, 255, 255, 0.85) !important;
        margin-left: 12px;
    }

    .navbar .nav-link:hover {
        color: #00e5bd !important;
    }

    .navbar .btn-light {
        background: linear-gradient(135deg, #00e5bd, #008f72);
        color: #031a14;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        padding: 7px 18px;
    }

    .navbar .btn-light:hover {
        background: #00c9a7;
        color: #031a14;
    }

    /* ================= LOGIN SECTION ================= */

    .login-section {
        min-height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
        background: linear-gradient(
            135deg,
            #031a14,
            #064e3b,
            #031a14
        );
    }

    /* ================= LOGIN CARD ================= */

    .login-card {
        width: 100%;
        max-width: 440px;
        background: #082f25;
        border: 1px solid #16483b;
        border-radius: 18px;
        padding: 38px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        position: relative;
        overflow: hidden;
    }

    .login-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(
            90deg,
            #00e5bd,
            #008f72
        );
    }

    /* ================= BRAND ================= */

    .logo {
        font-size: 42px;
        margin-bottom: 8px;
    }

    .brand-title {
        font-size: 30px;
        font-weight: 800;
        background: linear-gradient(
            135deg,
            #00e5bd,
            #008f72
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        color: #a7c9bf;
        font-size: 15px;
    }

    /* ================= FORM ================= */

    .form-label {
        font-weight: 600;
        color: #e4fff7;
    }

    .form-control {
        height: 48px;
        background: #031a14;
        color: #ffffff;
        border: 1px solid #286052;
        border-radius: 8px;
        padding: 10px 14px;
        transition: 0.25s;
    }

    .form-control::placeholder {
        color: #86a99e;
        opacity: 1;
    }

    .form-control:focus {
        background: #031a14;
        color: #ffffff;
        border-color: #00e5bd;
        box-shadow: 0 0 0 3px rgba(0, 229, 189, 0.12);
    }

    /* ================= LOGIN BUTTON ================= */

    .login-btn {
        height: 48px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(
            135deg,
            #00e5bd,
            #008f72
        );
        color: #031a14 !important;
        font-weight: 600;
        font-size: 16px;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: linear-gradient(
            135deg,
            #00c9a7,
            #007a61
        );
        color: #ffffff !important;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 229, 189, 0.20);
    }

    /* ================= ADMIN BUTTON ================= */

    .admin-btn {
        border-radius: 8px;
        font-weight: 600;
        border-color: #00e5bd;
        color: #00e5bd;
        background: transparent;
    }

    .admin-btn:hover {
        background: #00e5bd;
        border-color: #00e5bd;
        color: #031a14;
    }

    /* ================= REGISTER ================= */

    .register-link {
        color: #00e5bd;
        font-weight: 600;
        text-decoration: none;
    }

    .register-link:hover {
        color: #8fffe5;
    }

    /* ================= ALERT ================= */

    .alert-danger {
        background: #3b171b;
        color: #ffc9cf;
        border: 1px solid #79313a;
        border-radius: 8px;
    }

    /* ================= TEXT COLORS ================= */

    .text-muted {
        color: #a7c9bf !important;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 576px) {
        .login-section {
            padding: 30px 15px;
        }

        .login-card {
            padding: 30px 24px;
        }
    }
</style>

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            Food Rescue
        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/#about">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/#services">
                        Services
                    </a>
                </li>

                <li class="nav-item ms-1">
                    <a class="btn btn-light btn-sm"
                       href="/login/">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- ================= LOGIN ================= -->

<section class="login-section">

    <div class="login-card">


        <div class="text-center">

            <div class="logo">
                
            </div>

            <h2 class="brand-title">
                Food Rescue
            </h2>

            <p class="subtitle mb-4">
                Login to your account
            </p>

        </div>


        <!-- ERROR MESSAGE -->

        {% if msg %}

        <div class="alert alert-danger">
            {{ msg }}
        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="post">

            <input type="hidden"
                   name="next"
                   value="{{ next }}">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter username"
                       required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>

            </div>


            <div class="d-grid">

                <button type="submit"
                        class="btn login-btn text-white">

                    Login

                </button>

            </div>


          

        </form>


        <!-- REGISTER -->

        <div class="text-center mt-4">

            <p class="text-muted mb-0">

                Don't have an account?

                <a href="/register/"
                   class="register-link">

                    Register

                </a>

            </p>

        </div>


    </div>

</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
