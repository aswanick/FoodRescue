
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Food - Food Rescue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #020b08, #06271e, #001610);
            color: #e5f5ef;
            min-height: 100vh;
        }

        .container {
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .card {
            background: rgba(5, 24, 19, 0.96);
            border: 1px solid #145c48 !important;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.08);
        }

        .card-header {
            background: linear-gradient(135deg, #063d2e, #08785a, #00a982);
            color: #ffffff;
            padding: 22px;
            border-bottom: 1px solid #16866a;
        }

        .card-body {
            padding: 30px !important;
        }

        .form-label {
            color: #c8f5e5;
            font-weight: 500;
        }

        .form-control {
            background-color: #071a15;
            color: #e5fff5;
            border: 1px solid #245744;
            border-radius: 8px;
            padding: 11px 13px;
        }

        .form-control:focus {
            background-color: #0a261d;
            color: #ffffff;
            border-color: #00e6a0;
            box-shadow: 0 0 0 0.2rem rgba(0, 230, 160, 0.15);
        }

        .form-control::placeholder {
            color: #7fa99a;
        }

        input[type="file"].form-control {
            color: #b8d9cc;
        }

        input[type="file"]::file-selector-button {
            background: #124a37;
            color: #e5fff5;
            border: none;
            border-radius: 5px;
            padding: 7px 12px;
            margin-right: 12px;
        }

        input[type="file"]::file-selector-button:hover {
            background: #08785a;
        }

        .current-image {
            border: 2px solid #00b985;
            border-radius: 10px;
            padding: 4px;
            background: #03130e;
        }

        .text-muted {
            color: #8aa99c !important;
        }

        .btn-update {
            background: linear-gradient(135deg, #00c995, #00a878);
            color: #001b12;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            padding: 11px;
            transition: 0.3s ease;
        }

        .btn-update:hover {
            background: linear-gradient(135deg, #36f5bd, #00c995);
            color: #001b12;
            box-shadow: 0 0 16px rgba(0, 230, 160, 0.3);
        }

        .btn-cancel {
            background: #122d23;
            color: #bcebd9;
            border: 1px solid #28684f;
            border-radius: 8px;
            padding: 11px 22px;
            transition: 0.3s ease;
        }

        .btn-cancel:hover {
            background: #1b4735;
            color: #ffffff;
            border-color: #00c995;
        }

        @media (max-width: 576px) {
            .card-body {
                padding: 20px !important;
            }

            .d-flex.gap-2 {
                flex-direction: column;
            }

            .btn-cancel {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header text-center">
                    <h3 class="mb-0 fw-bold">Edit Food</h3>
                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Food Name</label>
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   value="{{ food.name }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text"
                                   name="category"
                                   class="form-control"
                                   value="{{ food.category }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number"
                                   name="quantity"
                                   class="form-control"
                                   value="{{ food.quantity }}"
                                   min="1"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number"
                                   name="price"
                                   class="form-control"
                                   value="{{ food.price }}"
                                   step="0.01"
                                   min="0"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Available Time</label>
                            <input type="text"
                                   name="available_time"
                                   class="form-control"
                                   value="{{ food.available_time }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description"
                                      class="form-control"
                                      rows="4"
                                      required>{{ food.description }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Current Image</label>

                            {% if food.image %}
                                <div class="mb-2">
                                    <img src="{{ food.image.url }}"
                                         width="180"
                                         height="120"
                                         class="current-image"
                                         style="object-fit: cover;">
                                </div>
                            {% else %}
                                <p class="text-muted">No image available</p>
                            {% endif %}
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Change Image</label>
                            <input type="file"
                                   name="image"
                                   class="form-control"
                                   accept="image/*">
                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-update flex-grow-1">
                                Update Food
                            </button>

                            <a href="{% url 'hotel_food' %}"
                               class="btn btn-cancel">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
