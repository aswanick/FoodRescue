
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Food - Food Rescue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #031a14;
            color: #e4fff7;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #05251d, #008f72);
            box-shadow: 0 4px 15px rgba(0, 229, 189, 0.12);
        }

        .navbar-brand {
            color: #e4fff7 !important;
        }

        .food-card {
            background: #05251d;
            border: 1px solid #176b55;
            border-radius: 16px;
            padding: 22px !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #00e5bd;
            font-weight: 700;
        }

        .form-label {
            color: #c2e4da;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-control,
        .form-select {
            background-color: #082f25;
            color: #e4fff7;
            border: 1px solid #176b55;
            border-radius: 8px;
        }

        .form-control::placeholder {
            color: #a7c9bf;
            opacity: 0.8;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #0a392d;
            color: #e4fff7;
            border-color: #00e5bd;
            box-shadow: 0 0 0 0.2rem rgba(0, 229, 189, 0.15);
        }

        .form-select option {
            background-color: #082f25;
            color: #e4fff7;
        }

        input[type="file"]::file-selector-button {
            background: #008f72;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            margin: -6px 12px -6px -12px;
            cursor: pointer;
        }

        .btn-add {
            background: linear-gradient(135deg, #008f72, #00e5bd);
            color: #031a14;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .btn-add:hover {
            background: linear-gradient(135deg, #00e5bd, #008f72);
            color: #031a14;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 229, 189, 0.2);
        }

        input[type="number"] {
            color-scheme: dark;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'userhome' %}">
             Food Rescue
        </a>
    </div>
</nav>

<div class="container mt-4 mb-4">

    <div class="card food-card mx-auto" style="max-width: 450px;">

        <h2 class="text-center mb-4">
            Add Surplus Food
        </h2>

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Food Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter food name"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <select name="category" class="form-select" required>
                    <option value="">Select Category</option>
                    <option>Rice</option>
                    <option>Bakery</option>
                    <option>Snacks</option>
                    <option>Meals</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>

                <input type="number"
                       name="quantity"
                       class="form-control"
                       placeholder="Enter quantity"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>

                <input type="number"
                       name="price"
                       step="0.01"
                       class="form-control"
                       placeholder="Enter price"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Available Time</label>

                <input type="text"
                       name="available_time"
                       class="form-control"
                       placeholder="Example: 6 PM - 9 PM"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea name="description"
                          class="form-control"
                          rows="3"
                          placeholder="Food description"
                          required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Food Image</label>

                <input type="file"
                       name="image"
                       class="form-control"
                       accept="image/*">
            </div>

            <button type="submit" class="btn btn-add w-100">
                Add Food
            </button>

        </form>

    </div>

</div>

</body>
</html>
