<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Order - Food Rescue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020b08, #06271e, #001610);
            color: #e5fff5;
        }

        .order-card {
            max-width: 600px;
            background: linear-gradient(145deg, #0a2119, #04150f);
            border: 1px solid rgba(0, 201, 149, 0.3);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            background: linear-gradient(135deg, #063d2e, #08785a, #00a982);
            color: #ffffff;
            padding: 20px;
            border: none;
        }

        .card-header h3 {
            font-weight: 700;
        }

        .card-body {
            padding: 28px;
        }

        .food-name {
            color: #00e6a2;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .food-details {
            color: #d1fae5;
            margin-bottom: 12px;
        }

        .food-details strong {
            color: #5eead4;
        }

        hr {
            border-color: rgba(94, 234, 212, 0.35);
            margin: 24px 0;
        }

        .form-label {
            color: #d1fae5;
            font-weight: 600;
        }

        .form-control {
            background-color: #061a13;
            border: 1px solid #17634d;
            color: #ffffff;
            border-radius: 8px;
            padding: 11px 12px;
        }

        .form-control:focus {
            background-color: #061a13;
            color: #ffffff;
            border-color: #00e6a2;
            box-shadow: 0 0 0 0.2rem rgba(0, 230, 162, 0.15);
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .btn-order {
            background: linear-gradient(135deg, #00c995, #008f68);
            color: #02140e;
            font-weight: 700;
            border: none;
            border-radius: 9px;
            padding: 12px;
            transition: 0.3s ease;
        }

        .btn-order:hover {
            background: linear-gradient(135deg, #00e6a2, #00a982);
            color: #02140e;
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(0, 230, 162, 0.2);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 14px;
            background: transparent;
            color: #5eead4;
            border: 1px solid #08785a;
            border-radius: 9px;
            padding: 11px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .btn-back:hover {
            background: #08785a;
            color: #ffffff;
        }

        .alert-danger {
            background: #3b1519;
            color: #fecaca;
            border: 1px solid #be123c;
            border-radius: 9px;
        }
    </style>
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="card order-card mx-auto">

        <div class="card-header">
            <h3 class="mb-0">Place Order</h3>
        </div>

        <div class="card-body">

            {% if msg %}
            <div class="alert alert-danger">
                {{ msg }}
            </div>
            {% endif %}

            <h4 class="food-name">{{ food.name }}</h4>

            <p class="food-details">
                <strong>Category:</strong> {{ food.category }}
            </p>

            <p class="food-details">
                <strong>Price:</strong> ₹{{ food.price }}
            </p>

            <p class="food-details">
                <strong>Available Time:</strong> {{ food.available_time }}
            </p>

            <hr>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text"
                           name="customer_name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Quantity</label>
                    <input type="number"
                           name="quantity"
                           class="form-control"
                           min="1"
                           max="{{ food.quantity }}"
                           required>
                </div>

                <button type="submit" class="btn btn-order w-100">
                    Place Order
                </button>

            </form>

            <a href="{% url 'available_food' %}" class="btn-back">
                ← Back to Available Food
            </a>

        </div>
    </div>
</div>

</body>
</html>
